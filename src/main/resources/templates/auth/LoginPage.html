<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Diploma Portal</title>


    <!-- Favicon -->

    <link rel="icon"
          type="image/x-icon"
          th:href="@{/images/logo.ico}">


    <!-- Styles -->

    <link rel="stylesheet"
          th:href="@{/css/GlobalStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/AuthStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/FooterStyle.css}">


    <!-- Scripts -->

    <script th:src="@{/js/AuthTransition.js}"
            defer>
    </script>

    <script th:src="@{/js/PasswordToggle.js}"
            defer>
    </script>

</head>


<body>


<main class="auth-page">

    <div class="auth-container login-container"
         id="authContainer">


        <!-- ========================================
             LOGIN FORM
        ========================================= -->

        <section class="auth-form-side">


            <h1 class="auth-title">
                Welcome back
            </h1>


            <p class="auth-subtitle">
                Sign in to continue to the Diploma Theses System.
            </p>



            <!-- SUCCESS MESSAGE -->

            <div class="auth-message success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>



            <!-- LOGIN ERROR -->

            <div class="auth-message error"
                 th:if="${param.error}">

                Invalid username or password.

            </div>



            <!-- LOGOUT MESSAGE -->

            <div class="auth-message success"
                 th:if="${param.logout}">

                You have been logged out successfully.

            </div>



            <form method="post"
                  th:action="@{/login}">


                <!-- USERNAME -->

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>


                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="auth-field">

				    <label for="password">
				        Password
				    </label>
				
				
				    <div class="password-wrapper">
				
				        <input
				            id="password"
				            name="password"
				            type="password"
				            autocomplete="current-password"
				            placeholder="Enter your password"
				            required>
				
				
				        <button
				            type="button"
				            class="password-toggle"
				            data-target="password"
				            aria-label="Show password">
				
				            <svg class="eye-icon eye-open"
				                 viewBox="0 0 24 24"
				                 aria-hidden="true">
				
				                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
				
				                <circle cx="12"
				                        cy="12"
				                        r="3"></circle>
				
				            </svg>
				
				
				            <svg class="eye-icon eye-closed"
				                 viewBox="0 0 24 24"
				                 aria-hidden="true">
				
				                <path d="M3 3 21 21"></path>
				
				                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
				
				                <path d="M9.9 4.2A11.7 11.7 0 0 1 12 4c6.5 0 10 8 10 8a15 15 0 0 1-3.1 4.2"></path>
				
				                <path d="M6.2 6.2C3.4 8 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1"></path>
				
				            </svg>
				
				        </button>
				
				    </div>
				
				</div>



                <!-- LOGIN BUTTON -->

                <button class="auth-button"
                        type="submit">

                    Log in

                </button>


            </form>


        </section>



        <!-- ========================================
             DIAGONAL PANEL
        ========================================= -->

        <section class="auth-visual-side">

            <div class="auth-visual-content">


                <div class="auth-logo">

                    <img th:src="@{/images/logo.png}"
                         src="/images/logo.png"
                         alt="Diploma Portal Logo">

                </div>


                <h2>
                    New here?
                </h2>


                <p>
                    Create your account and start managing
                    diploma theses through the portal.
                </p>


                <a class="auth-switch"
                   id="registerLink"
                   th:href="@{/register}">

                    Create Account

                </a>


            </div>

        </section>


    </div>

</main>



<div th:replace="~{fragments/footer :: footer}"></div>


</body>

</html>
