<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | Diploma Portal</title>
    
    <!-- Favicon -->
	<link rel="icon" type="image/x-icon" th:href="@{/images/logo.ico}">

    <link rel="stylesheet"
          th:href="@{/css/GlobalStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/CommonLayoutStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/CommonComponentsStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/ProfileStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/StudentProfileStyle.css}">

    <link rel="stylesheet"
          th:href="@{/css/FooterStyle.css}">

	<script th:src="@{/js/ProfilePicturePreview.js}" defer></script>

</head>


<body>


<main class="portal-page student-profile-page">

    <div class="portal-container portal-container--profile student-profile-container">


        <!-- ========================================
             HEADER
        ========================================= -->

        <header class="page-header page-header--student student-profile-header">

            <div>

                <span class="page-eyebrow profile-eyebrow">
                    STUDENT PORTAL
                </span>

                <h1>Student Profile</h1>

                <p>
                    Manage your academic and contact information.
                </p>

            </div>


            <a class="btn btn-primary dashboard-button"
               th:href="@{/student/dashboard}">

                Back to Dashboard

            </a>

        </header>



        <!-- ========================================
             PROFILE CARD
        ========================================= -->

        <section class="surface-card profile-card student-profile-card">


            <form th:action="@{/student/profile}"
                  th:object="${studentProfile}"
                  method="post"
                  enctype="multipart/form-data">


                <!-- ========================================
                     PROFILE PICTURE
                ========================================= -->

                <div class="profile-picture-section">


                    <div class="profile-picture-wrapper">


                        <!-- SAVED PROFILE PICTURE -->

                        <img
                            class="profile-picture"
                            id="profilePreview"

                            th:if="${
                                studentProfile.profilePicturePath != null
                                && !#strings.isEmpty(
                                    studentProfile.profilePicturePath
                                )
                            }"

                            th:src="@{${studentProfile.profilePicturePath}}"

                            alt="Student profile picture">



                        <!-- INITIAL FALLBACK -->

                        <div
                            class="profile-picture-placeholder"
                            id="profilePlaceholder"

                            th:if="${
                                studentProfile.profilePicturePath == null
                                || #strings.isEmpty(
                                    studentProfile.profilePicturePath
                                )
                            }">


                            <span th:text="${#strings.toUpperCase(
                                #strings.substring(
                                    studentProfile.fullName != null
                                    && !#strings.isEmpty(
                                        studentProfile.fullName
                                    )
                                    ? studentProfile.fullName
                                    : 'S',
                                    0,
                                    1
                                )
                            )}">

                                S

                            </span>


                        </div>


                    </div>



                    <div class="picture-actions">

                        <div>

                            <h2>Profile Picture</h2>

                            <p>
                                Upload a photo to personalize your profile.
                            </p>

                        </div>


                        <input
                            id="profilePicture"
                            name="profilePicture"
                            type="file"
                            accept="image/png,image/jpeg,image/webp"
                            hidden>


                        <label class="btn btn-secondary upload-button"
                               for="profilePicture">

                            Choose Picture

                        </label>


                        <span class="picture-hint">
                            JPG, PNG or WEBP
                        </span>

                    </div>


                </div>



                <div class="profile-divider"></div>



                <!-- ========================================
                     STUDENT IDENTITY
                ========================================= -->

                <div class="student-identity">

                    <div>

                        <h2 th:text="${
                            studentProfile.fullName != null
                            && !#strings.isEmpty(studentProfile.fullName)
                            ? studentProfile.fullName
                            : 'Student'
                        }">

                            Student

                        </h2>


                        <p>

                            Registration No.

                            <strong th:text="${
                                studentProfile.registrationNumber != null
                                && !#strings.isEmpty(
                                    studentProfile.registrationNumber
                                )
                                ? studentProfile.registrationNumber
                                : '-'
                            }">

                                -

                            </strong>

                        </p>

                    </div>

                </div>



                <div class="profile-divider"></div>



                <!-- ========================================
                     PROFILE INFORMATION
                ========================================= -->

                <div class="profile-form-grid student-form-grid">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            id="fullName"
                            type="text"
                            th:field="*{fullName}"
                            placeholder="Enter your full name"
                            required>

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            type="email"
                            th:field="*{email}"
                            placeholder="student@university.edu"
                            required>

                    </div>



                    <!-- REGISTRATION NUMBER -->

                    <div class="form-group">

                        <label for="registrationNumber">
                            Registration Number
                        </label>

                        <input
                            id="registrationNumber"
                            type="text"
                            th:field="*{registrationNumber}"
                            placeholder="Enter registration number"
                            required>

                    </div>



                    <!-- AVERAGE GRADE -->

                    <div class="form-group">

                        <label for="averageGrade">
                            Average Grade
                        </label>

                        <input
                            id="averageGrade"
                            type="number"
                            step="0.01"
                            min="0"
                            max="10"
                            th:field="*{averageGrade}"
                            placeholder="e.g. 8.25">

                    </div>



                    <!-- REMAINING COURSES -->

                    <div class="form-group full-width">

                        <label for="remainingCourses">
                            Remaining Courses
                        </label>

                        <input
                            id="remainingCourses"
                            type="number"
                            min="0"
                            th:field="*{remainingCourses}"
                            placeholder="Number of remaining courses">

                    </div>


                </div>



                <!-- ========================================
                     ACTIONS
                ========================================= -->

                <div class="profile-actions">


                    <a class="btn btn-secondary cancel-button"
                       th:href="@{/student/dashboard}">

                        Cancel

                    </a>


                    <button class="btn btn-primary save-button"
                            type="submit">

                        Save Profile

                    </button>


                </div>


            </form>


        </section>


    </div>

</main>



<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
